name: origin_mobile
description: Origin — plateforme genealogique Cameroun. Application mobile Flutter.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: 2.5.1
  riverpod_annotation: 2.3.5

  # Routing
  go_router: 14.2.0

  # HTTP
  dio: 5.4.3+1
  dio_smart_retry: 6.0.0

  # Local DB
  drift: 2.18.0
  sqlite3_flutter_libs: 0.5.20
  path_provider: 2.1.3
  path: ^1.9.1

  # Models / serialization
  freezed_annotation: 2.4.1
  json_annotation: 4.9.0

  # Secure storage
  flutter_secure_storage: 9.2.2

  # i18n
  intl: 0.20.2

  # Image
  cached_network_image: 3.3.1
  image_picker: 1.1.2
  flutter_image_compress: 2.3.0

  # Forms
  flutter_form_builder: ^10.3.0
  form_builder_validators: ^11.1.2

  # Logging
  logger: 2.3.0

  # Connectivity
  connectivity_plus: 6.0.3

  # Permissions
  permission_handler: 11.3.1

  # Fonts
  google_fonts: 6.2.1

  # Misc
  equatable: 2.0.5
  uuid: 4.4.0
  share_plus: 9.0.0
  url_launcher: 6.3.0
  package_info_plus: 8.0.0
  device_info_plus: 10.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Codegen
  build_runner: 2.4.11
  riverpod_generator: 2.4.0
  freezed: 2.5.2
  json_serializable: 6.8.0
  drift_dev: 2.18.0

  # Testing
  mocktail: 1.0.4

  # Lint
  very_good_analysis: 6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
