services:
  - type: web
    name: origin-api
    env: node
    plan: free
    region: frankfurt
    buildCommand: >-
      npm ci &&
      npm run build -w packages/shared-types &&
      npx prisma generate --schema=apps/api/prisma/schema.prisma &&
      npm run build -w apps/api
    startCommand: node apps/api/dist/main.js
    preDeployCommand: npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: TRUST_PROXY
        value: "1"
      - key: SWAGGER_ENABLED
        value: "false"
      - key: OTP_LOG_IN_DEV
        value: "false"
      - key: LOG_LEVEL
        value: info
      - key: THROTTLE_TTL
        value: "60"
      - key: THROTTLE_LIMIT
        value: "100"
      - key: PIN_SALT_ROUNDS
        value: "10"
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 90d
      # Secrets — à saisir manuellement dans le dashboard Render
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: WEB_APP_URL
        sync: false
      # Twilio (SMS/OTP) — optionnel en dev
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
