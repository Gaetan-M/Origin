name: CI

# S-010 — CI/CD pipeline for the Origin monorepo (Turborepo).
# Runs on PRs and on pushes to main + feat/** branches.
# NOTE: apps/mobile (Flutter) is excluded from the npm workspaces and is NOT
# built here. See the `flutter` job placeholder below (TODO) for a future
# dedicated Flutter pipeline.

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lightweight, fast-failing scan for obviously committed secrets.
  # Kept intentionally simple and high-signal (specific patterns only) to avoid
  # flaky false positives. Scans tracked files only (node_modules is untracked).
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for obvious secrets
        run: |
          set -euo pipefail
          # High-signal patterns: AWS access keys, private key blocks,
          # Slack/GitHub tokens, and hardcoded JWT/Twilio secret assignments.
          PATTERNS='AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[0-9A-Za-z-]{10,}|gh[pousr]_[0-9A-Za-z]{30,}|(JWT_(ACCESS|REFRESH)_SECRET|TWILIO_AUTH_TOKEN)\s*[:=]\s*["'"'"'][^"'"'"'$<{][^"'"'"']{6,}'
          # Exclude lockfiles and this workflow file from the scan.
          if git grep -nIE "$PATTERNS" -- \
              ':(exclude)package-lock.json' \
              ':(exclude)**/package-lock.json' \
              ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Potential committed secret detected (see matches above)."
            exit 1
          fi
          echo "No obvious secrets found."

  build:
    name: Lint / Typecheck / Test / Build
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # --- Build ordering mirrors render.yaml -------------------------------
      # apps/api depends on the compiled @origin/shared-types package and on the
      # generated Prisma client, so both must exist before typecheck/build.
      - name: Build shared-types (api depends on it)
        run: npm run build -w packages/shared-types

      - name: Generate Prisma client
        run: npx prisma generate --schema=apps/api/prisma/schema.prisma
      # ----------------------------------------------------------------------

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  # TODO (S-010 follow-up): dedicated Flutter job for apps/mobile.
  # apps/mobile is excluded from npm workspaces and needs the Flutter toolchain
  # (subosito/flutter-action) to run `flutter analyze` + `flutter test`.
  # flutter:
  #   name: Flutter analyze / test
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: subosito/flutter-action@v2
  #     - run: flutter pub get
  #       working-directory: apps/mobile
  #     - run: flutter analyze
  #       working-directory: apps/mobile
  #     - run: flutter test
  #       working-directory: apps/mobile
